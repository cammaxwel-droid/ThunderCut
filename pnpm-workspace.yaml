# Explicit dependency install-script permissions. Versions stay in pnpm-lock.yaml.
allowBuilds:
  electron: true
  esbuild: true
  sharp: true
  unrs-resolver: true
  workerd: true
  electron-winstaller: false

# Keep both Undici release lines on the reviewed security fixes.
overrides:
  'undici@^6.0.0': 6.29.1
  'undici@^7.0.0': 7.30.1
  # Keep the pinned Cloudflare WebSocket receivers on the metadata-limit fix.
  'ws@8.18.0': 8.21.0
  # Share the fixed Sharp version already used by Next with this Miniflare release.
  'miniflare@4.20260515.0>sharp': 0.35.5
  # Cap glob expansion in the affected minimatch release lines.
  'minimatch@>=7.0.0 <11.0.1': 11.0.1
  # Fix Windows dev-server traversal across the shared esbuild dependency.
  'esbuild@0.27.3': 0.28.1
